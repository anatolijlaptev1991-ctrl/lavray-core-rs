# LAVRay Core (Rust) — workspace.
#
# Перепись Go-ядра lavray/core на Rust с теми же стандартами качества, что и
# Linux-сборка: clippy pedantic+perf = 0 предупреждений, всесторонние тесты,
# трещотка размеров, CI, суб-агент аудиты. См. docs/ARCHITECTURE.md и
# docs/ROADMAP.md (поэтапный план переписи).
#
# Слои (crates/):
#   lavray-presets  — маршрутные пресеты (preset.schema.v1), валидация, builtin
#   lavray-model    — модели данных (Profile/Group/Settings/geo), canonjson
#   lavray-links    — парсинг прокси-ссылок (vmess/vless/trojan/ss/hy2/tuic)
#   lavray-store    — persistence (sqlite, rusqlite)
#   lavray-cfgbuild — построение конфига sing-box (route/dns/inbounds/outbounds)
#   lavray-proto    — API-контракт (prost/tonic из proto/lavray.proto)
#   lavray-engine   — граница интеграции с прокси-движком
#   lavray-api      — ConnectRPC/gRPC сервисы
#   lavray-core     — бинарь: lifecycle, stdin-протокол, сервер

[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.9.3"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-only"
repository = "https://github.com/anatolijlaptev1991-ctrl/lavray-core-rs"
authors = ["LAVRay <lavray@users.noreply.github.com>"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
base64 = "0.22"
url = "2"
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }

# Единые линты для всех крейтов: pedantic + perf, ноль предупреждений.
# Обоснованные исключения — точечно в коде с комментарием (как в Linux-сборке).
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
# Идиоматичные паттерны, не являющиеся дефектами (обоснование в docs/ARCHITECTURE.md):
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
# Data-модели естественно содержат много bool-флагов и serde-сигнатуры &T.
struct_excessive_bools = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
