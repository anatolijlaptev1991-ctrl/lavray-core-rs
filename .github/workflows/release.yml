# Release LAVRay Core: чистый Rust на всех платформах, где возможен.
# Триггер — тег v*. Матрица собирает release-бинарники (fat LTO,
# codegen-units=1, strip) и прикладывает их к GitHub Release.
#
# Самодостаточность сборок:
#   Windows  — статический CRT (+crt-static): без VCRUNTIME140.dll;
#              wintun.dll (x64/arm64) приложена отдельно для TUN-режима.
#   Linux    — gnu-таргеты динамические (glibc хоста сборки);
#              musl-таргеты (x86_64/aarch64/armv7) — static-pie через
#              cargo-zigbuild: запускаются на OpenWrt/Alpine/старых дистрибутивах.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Пины кросс-тулчейна (проверены локально): zig мульти-таргет.
  ZIGBUILD_VERSION: "0.24.1"
  ZIG_VERSION: "0.17.1"
  WINTUN_VERSION: "0.14.1"

jobs:
  build:
    name: "build ${{ matrix.name }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
          - name: windows-arm64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            ext: .exe
            soft: true # кросс-цель: не блокирует релиз
          - name: linux-x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - name: linux-arm64
            os: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
          - name: linux-x64-musl
            os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - name: linux-arm64-musl
            os: ubuntu-24.04
            target: aarch64-unknown-linux-musl
            zig: true
          - name: linux-armv7-musl
            os: ubuntu-24.04
            target: armv7-unknown-linux-musleabihf
            zig: true
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
    continue-on-error: ${{ matrix.soft || false }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}

      - name: "protoc (linux)"
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          # libc6-dev-arm64-cross — заголовки цели (Recommends у кросс-gcc,
          # без них ring падает на bits/libc-header-start.h).
          sudo apt-get install -y --no-install-recommends protobuf-compiler \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross musl-tools

      - name: "protoc (macos)"
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: "protoc (windows)"
        if: runner.os == 'Windows'
        run: choco install -y protoc

      # cargo-zigbuild + zig: статические musl-кросс-таргеты без sysroot.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: matrix.zig
        with:
          python-version: "3.12"
      - name: "cargo-zigbuild + zig"
        if: matrix.zig
        run: |
          set -euo pipefail
          pip install "cargo-zigbuild==$ZIGBUILD_VERSION" "ziglang==$ZIG_VERSION"
          cargo-zigbuild --version
          python -m ziglang version

      - name: "build (release, fat LTO)"
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          # Windows: статический CRT — бинарник без VCRUNTIME140.dll.
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
        # на windows-latest оболочка по умолчанию PowerShell — нужен bash.
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.zig || 'false' }}" = "true" ]; then
            cargo zigbuild --release --locked -p lavray-core --target ${{ matrix.target }}
          else
            cargo build --release --locked -p lavray-core --target ${{ matrix.target }}
          fi

      - name: "artifact"
        shell: bash
        run: |
          set -euo pipefail
          src="target/${{ matrix.target }}/release/lavray-core${{ matrix.ext || '' }}"
          dst="lavray-core-${{ matrix.name }}${{ matrix.ext || '' }}"
          cp "$src" "$dst"
          sha256sum "$dst" > "$dst.sha256"
          ls -la lavray-core-*

      - uses: actions/upload-artifact@v7
        with:
          name: lavray-core-${{ matrix.name }}
          path: lavray-core-${{ matrix.name }}*

  # wintun.dll для TUN-режима Windows (драйвер грузится в рантайме по
  # имени wintun.dll рядом с бинарём; здесь — обе архитектуры + лицензия).
  wintun:
    name: "wintun.dll (x64 + arm64)"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: "download + unpack"
        run: |
          set -euo pipefail
          mkdir -p dist
          curl -sSL -o wintun.zip "https://www.wintun.net/builds/wintun-$WINTUN_VERSION.zip"
          unzip -j wintun.zip "wintun/bin/amd64/wintun.dll" -d dist/amd64
          unzip -j wintun.zip "wintun/bin/arm64/wintun.dll" -d dist/arm64
          unzip -j wintun.zip "wintun/LICENSE.txt" -d dist
          mv dist/LICENSE.txt dist/wintun-LICENSE.txt
          mv dist/amd64/wintun.dll dist/wintun-x64.dll
          mv dist/arm64/wintun.dll dist/wintun-arm64.dll
          rmdir dist/amd64 dist/arm64
          cd dist && sha256sum wintun-x64.dll wintun-arm64.dll > wintun.sha256
          ls -la
      - uses: actions/upload-artifact@v7
        with:
          name: lavray-core-wintun
          path: dist/*

  release:
    name: "github release"
    needs: [build, wintun]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: "upload assets"
        env:
          GH_TOKEN: ${{ github.token }}
          # без checkout gh не может определить репо через git.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ls -la dist/
          # тег сам релиз не создаёт: создаём (если ещё нет), затем upload.
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes || true
          gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          gh release view "${GITHUB_REF_NAME}" --json assets -q '.assets[].name'
