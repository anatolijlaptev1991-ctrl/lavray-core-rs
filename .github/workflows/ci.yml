# CI LAVRay Core (Rust) — те же стандарты, что и Linux-сборка:
# fmt + clippy pedantic+perf (ноль предупреждений) + тесты + release-сборка
# + smoke реального кода на артефакте + трещотка размеров.
# Каждый шаг верифицирован в WSL/Linux — «ловится только на ubuntu».

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: "fmt + clippy + tests"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # lavray-proto (tonic-build) требует системный protoc: ubuntu-24.04
      # раннеры больше не включают его в образ.
      - name: "protoc"
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends protobuf-compiler
          protoc --version

      - name: "fmt"
        run: cargo fmt --check

      - name: "clippy pedantic + perf (ноль предупреждений)"
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: "tests"
        run: cargo test --workspace --locked

      - name: "release build"
        run: cargo build --workspace --release --locked

  smoke:
    name: "Smoke: реальный код на release-артефакте"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: quality
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: "protoc"
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends protobuf-compiler

      # Собирается release-артефакт и запускается ПРИМЕР, использующий
      # библиотеку по назначению: строит конфиг из golden-входа и сверяется
      # с эталоном байт-в-байт (дух smoke lavray-linux: установил — проверил).
      - name: "Сборка release"
        run: cargo build --release --locked -p lavray-cfgbuild --example build_config

      - name: "Smoke: golden-конфиги байт-в-байт"
        run: |
          set -euo pipefail
          cd crates/lavray-cfgbuild
          for g in tests/testdata/golden/*.in.json; do
            w="${g%.in.json}.want.json"
            ../../target/release/examples/build_config "$g" "$w"
          done
          echo "Smoke OK: все golden-векторы байт-в-байт"

  ratchet:
    name: "трещотка размеров"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: "size ratchet"
        run: |
          set -euo pipefail
          python scripts/size_ratchet.py