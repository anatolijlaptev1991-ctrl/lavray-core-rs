# lavray-engine — прокси-движок LAVRay на Rust (волна 7; решение владельца
# 18.11: полный Rust, без Go sing-box). 7a: mixed-инбаунд + outbound direct.

[package]
name = "lavray-engine"
description = "LAVRay proxy engine (Rust): mixed inbound, outbounds, relay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
tun = { package = "tun", version = "0.6", default-features = false, features = ["async"] }

[dependencies]
lavray-model = { path = "../lavray-model" }
tokio = { workspace = true }
blake3 = { workspace = true }
aes-gcm = { workspace = true }
chacha20poly1305 = { workspace = true }
hkdf = { workspace = true }
x25519-dalek = { workspace = true }
sha2 = { workspace = true }
md-5 = { workspace = true }
getrandom = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
quinn = { workspace = true }
rcgen = { workspace = true }
webpki-roots = { workspace = true }
aes = { workspace = true }
hmac = { workspace = true }
crc32fast = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
